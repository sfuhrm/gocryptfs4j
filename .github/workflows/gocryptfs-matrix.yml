name: gocryptfs-version-matrix

on:
  push:
    branches: [main, master]
  schedule:
    # Weekly, to catch regressions introduced by new gocryptfs releases.
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned gocryptfs releases spanning the format's history:
        #   1.4     earliest release with a static (without_openssl) Linux binary
        #   1.8.0   last release of the v1.x line
        #   2.0     first release of the v2.x line
        #   2.6.1   current release
        # Pre-1.4 releases ship only dynamically linked binaries that depend on
        # the long-retired OpenSSL 1.0 (libcrypto.so.1.0.0), so they cannot run
        # on a modern runner; the pre-HKDF on-disk format is instead covered by
        # the static golden fixtures under core/src/test/resources.
        gocryptfs: ["1.4", "1.8.0", "2.0", "2.6.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Remove conflicting fuse3 for gocryptfs v1.x
        if: startsWith(matrix.gocryptfs, '1.')
        run: sudo apt-get remove -y fuse3

      - name: Install FUSE
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          # v1.x mounts via the fuse2 helper 'fusermount', v2.x via the fuse3
          # helper 'fusermount3'. On Ubuntu 24.04 the two packages conflict
          # (fuse3 Breaks fuse), so install per major version.
          packages: ${{ startsWith(matrix.gocryptfs, '1.') && 'fuse' || 'fuse3' }}
          version: 1.0

      - name: Cache gocryptfs v${{ matrix.gocryptfs }}
        id: cache-gocryptfs
        uses: actions/cache@v6
        with:
          path: ~/.local/gocryptfs
          key: gocryptfs-${{ matrix.gocryptfs }}-linux-static-amd64

      - name: Download gocryptfs v${{ matrix.gocryptfs }}
        if: steps.cache-gocryptfs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/gocryptfs"
          curl -fsSL -o /tmp/gocryptfs.tar.gz \
            "https://github.com/rfjakob/gocryptfs/releases/download/v${{ matrix.gocryptfs }}/gocryptfs_v${{ matrix.gocryptfs }}_linux-static_amd64.tar.gz"
          tar -xzf /tmp/gocryptfs.tar.gz -C "$HOME/.local/gocryptfs" gocryptfs
          chmod +x "$HOME/.local/gocryptfs/gocryptfs"

      - name: Add gocryptfs to PATH
        run: echo "$HOME/.local/gocryptfs" >> "$GITHUB_PATH"

      - name: Verify gocryptfs + FUSE availability
        run: |
          gocryptfs -version
          ls -la /dev/fuse || true

      - name: Build and test (unit + integration)
        run: mvn -B clean verify
