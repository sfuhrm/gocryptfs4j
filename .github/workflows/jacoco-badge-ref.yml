---
name: Jacoco Coverage and Badge Generator

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

# The badge is always force-pushed to the same `gh-pages` branch, so concurrent
# runs race and fail with "cannot lock ref". Serialize all runs of this workflow.
concurrency:
  group: jacoco-badge
  cancel-in-progress: false

jobs:
  call-workflow-passing-data:
    uses: sfuhrm/github_workflows/.github/workflows/jacoco-badge.yml@main
    with:
      java_version: 17
      maven_target: verify
      artifact_name: jacoco-report
      artifact_path: ./coverage/target/site/jacoco-aggregate/
      jacoco_csv_path: >
        ./coverage/target/site/jacoco-aggregate/jacoco.csv