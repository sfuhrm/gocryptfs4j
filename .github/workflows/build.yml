name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # LTS JDKs used to build. The produced bytecode targets Java 8
        # (maven.compiler.release=8), so the library runs on Java 8+; building
        # itself needs JDK 9+ (the --release flag) and the test suite needs
        # JDK 11+ (Mockito 5), so Java 8 is not a build JDK.
        java: ["11", "17", "21", "25"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install gocryptfs and FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y gocryptfs fuse

      - name: Check gocryptfs + FUSE availability
        run: |
          gocryptfs -version
          ls -la /dev/fuse || true

      - name: Build and test (unit + integration)
        run: mvn -B clean verify

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: gocryptfs4j-jdk${{ matrix.java }}
          path: |
            core/target/*.jar
            nio/target/*.jar
            fido2-libfido2/target/*.jar
          if-no-files-found: error
