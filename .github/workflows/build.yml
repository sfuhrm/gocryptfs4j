name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install gocryptfs and FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y gocryptfs fuse

      - name: Check gocryptfs + FUSE availability
        run: |
          gocryptfs -version
          ls -la /dev/fuse || true

      - name: Build and test (unit + integration)
        run: mvn -B clean verify

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: gocryptfs4j
          path: target/*.jar
          if-no-files-found: error
