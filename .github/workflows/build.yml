name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All LTS JDKs that can build the project. The baseline is Java 11
        # (maven.compiler.release=11), so Java 8 is not buildable and is
        # intentionally excluded.
        java: ["11", "17", "21", "25"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install gocryptfs and FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y gocryptfs fuse

      - name: Check gocryptfs + FUSE availability
        run: |
          gocryptfs -version
          ls -la /dev/fuse || true

      - name: Build and test (unit + integration)
        run: mvn -B clean verify

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: gocryptfs4j-jdk${{ matrix.java }}
          path: |
            core/target/*.jar
            nio/target/*.jar
          if-no-files-found: error
